name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        run: |
          python -m pip install --no-deps .
          python -m unittest discover -s tests -v
      - name: Build standalone archive
        run: |
          python tools/build_zipapp.py
          python dist/private-desktop.pyz --help
      - name: Publish archive and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/private-desktop.pyz dist/SHA256SUMS --verify-tag --title "$RELEASE_TAG" --generate-notes
