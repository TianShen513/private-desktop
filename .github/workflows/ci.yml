name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install --no-deps .
      - name: Test gateway and launcher
        run: python -m unittest discover -s tests -v
      - name: Build standalone archive
        run: python tools/build_zipapp.py
      - name: Check standalone entry point
        run: python dist/private-desktop.pyz --help

  desktop:
    name: Real Linux desktop
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install --no-deps .
      - name: Build pinned desktop image
        run: private-desktop build
      - name: Exercise actual accessibility and privacy boundary
        run: python tests/smoke_sandbox.py private-desktop:0.1.0
