[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "private-desktop"
version = "0.1.0"
description = "An offline disposable desktop and a deny-by-default privacy gateway for agent-desktop"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "private-desktop contributors"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
]

[project.scripts]
private-desktop = "private_desktop.cli:main"

[project.urls]
Repository = "https://github.com/TianShen513/private-desktop"
Issues = "https://github.com/TianShen513/private-desktop/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
private_desktop = ["assets/*"]
